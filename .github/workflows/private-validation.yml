name: Private MainAlto validation

on:
  workflow_dispatch:
    inputs:
      windows_diagnostic:
        description: 'Diagnose only the two unresolved Windows test cases'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: private-mainalto-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'alexbonemberger/MainAlto-open' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    environment: private-validation
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_diagnostic && '["windows-latest"]' || '["ubuntu-24.04","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'

      - name: Materialize approved source
        shell: pwsh
        env:
          MAINALTO_CI_READ_TOKEN: ${{ secrets.MAINALTO_CI_READ_TOKEN }}
          MAINALTO_CI_SOURCE_SHA: ${{ secrets.MAINALTO_CI_SOURCE_SHA }}
        run: |
          @'
          import base64, os, pathlib, re, subprocess, sys
          def verify_raw_tree(source, pin, git):
              import hashlib
              root = source.resolve()
              count = 0
              names = set()
              for record in git("ls-tree", "-r", "-z", "--full-tree", pin).split(b"\0"):
                  if not record:
                      continue
                  meta, raw_path = record.split(b"\t", 1)
                  mode, kind, expected = meta.split(b" ")
                  if mode not in (b"100644", b"100755") or kind != b"blob":
                      raise RuntimeError()
                  parts = raw_path.decode("utf-8").split("/")
                  if any(not p or p in (".", "..") or p.lower() == ".git" or ":" in p or "\\" in p or p.endswith((" ", ".")) for p in parts):
                      raise RuntimeError()
                  key = "/".join(parts).casefold()
                  if key in names:
                      raise RuntimeError()
                  names.add(key)
                  path = root.joinpath(*parts)
                  if not path.is_file() or path.is_symlink() or not path.resolve().is_relative_to(root):
                      raise RuntimeError()
                  raw = path.read_bytes()
                  actual = hashlib.sha1(("blob %d\0" % len(raw)).encode("ascii") + raw).hexdigest().encode("ascii")
                  if actual != expected:
                      raise RuntimeError()
                  count += 1
              if count == 0:
                  raise RuntimeError()
              return count
          stage = 'INPUT'
          def main():
              global stage
              token = os.environ.pop("MAINALTO_CI_READ_TOKEN", "")
              pin = os.environ.pop("MAINALTO_CI_SOURCE_SHA", "")
              if not token or not re.fullmatch("[0-9a-f]{40}", pin):
                  raise RuntimeError()
              stage = "TEMP_ROOT"
              root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mainalto-private-ci"
              root.mkdir(exist_ok=False)
              source = root / "source"
              source.mkdir()
              env = {k:v for k,v in os.environ.items() if not k.upper().startswith(("GIT_", "MAINALTO_", "ACTIONS_", "GITHUB_", "RUNNER_"))}
              env.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=os.devnull, GIT_TERMINAL_PROMPT="0", GIT_NO_REPLACE_OBJECTS="1", GIT_LFS_SKIP_SMUDGE="1")
              def git(*args, auth=False):
                  e = env.copy()
                  if auth:
                      header = base64.b64encode(("x-access-token:" + token).encode()).decode()
                      e.update(GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.https://github.com/.extraheader", GIT_CONFIG_VALUE_0="AUTHORIZATION: basic " + header)
                  p = subprocess.run(["git", "-C", str(source), *args], env=e, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=180)
                  if p.returncode:
                      raise RuntimeError()
                  return p.stdout
              stage = "GIT_INIT"
              git("init", "--template=")
              git("config", "core.autocrlf", "false")
              git("config", "core.longpaths", "true")
              # In this disposable checkout only, preserve exact committed bytes.
              stage = "GIT_RAW_ATTRIBUTES"
              info = source / ".git" / "info"
              info.mkdir(exist_ok=True)
              (info / "attributes").write_bytes(b"* -text -filter -ident -working-tree-encoding -eol\n")
              git("remote", "add", "origin", "https://github.com/alexbonemberger/MainAlto.git")
              stage = "GIT_FETCH"
              git("fetch", "--no-tags", "--no-recurse-submodules", "origin", pin, auth=True)
              token = ""
              stage = "GIT_CHECKOUT"
              git("checkout", "--detach", pin)
              stage = "GIT_IDENTITY"
              if git("rev-parse", "HEAD").decode().strip() != pin:
                  raise RuntimeError()
              stage = "RAW_TREE"
              verify_raw_tree(source, pin, git)
              stage = "GIT_CLEAN"
              if git("status", "--porcelain"):
                  raise RuntimeError()
              stage = "PIN_RECORD"
              (root / "approved-pin").write_text(pin, encoding="ascii")
          try:
              main()
          except BaseException:
              print("PRIVATE_SOURCE_MATERIALIZATION_FAIL_" + stage)
              sys.exit(1)
          print("PRIVATE_SOURCE_MATERIALIZATION_PASS")
          '@ | python -I -B -S -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run fixed fixture suites
        shell: pwsh
        env:
          MAINALTO_CI_WINDOWS_DIAGNOSTIC: ${{ inputs.windows_diagnostic }}
        run: |
          @'
          import os, pathlib, subprocess, sys
          def verify_raw_tree(source, pin, git):
              import hashlib
              root = source.resolve()
              count = 0
              names = set()
              for record in git("ls-tree", "-r", "-z", "--full-tree", pin).split(b"\0"):
                  if not record:
                      continue
                  meta, raw_path = record.split(b"\t", 1)
                  mode, kind, expected = meta.split(b" ")
                  if mode not in (b"100644", b"100755") or kind != b"blob":
                      raise RuntimeError()
                  parts = raw_path.decode("utf-8").split("/")
                  if any(not p or p in (".", "..") or p.lower() == ".git" or ":" in p or "\\" in p or p.endswith((" ", ".")) for p in parts):
                      raise RuntimeError()
                  key = "/".join(parts).casefold()
                  if key in names:
                      raise RuntimeError()
                  names.add(key)
                  path = root.joinpath(*parts)
                  if not path.is_file() or path.is_symlink() or not path.resolve().is_relative_to(root):
                      raise RuntimeError()
                  raw = path.read_bytes()
                  actual = hashlib.sha1(("blob %d\0" % len(raw)).encode("ascii") + raw).hexdigest().encode("ascii")
                  if actual != expected:
                      raise RuntimeError()
                  count += 1
              if count == 0:
                  raise RuntimeError()
              return count
          def token_facts():
              import ctypes as c
              from ctypes import wintypes as w
              k = c.WinDLL("kernel32", use_last_error=True)
              a = c.WinDLL("advapi32", use_last_error=True)
              k.GetCurrentProcess.restype = w.HANDLE
              k.CloseHandle.argtypes = [w.HANDLE]
              k.CloseHandle.restype = w.BOOL
              a.OpenProcessToken.argtypes = [w.HANDLE, w.DWORD, c.POINTER(w.HANDLE)]
              a.OpenProcessToken.restype = w.BOOL
              a.GetTokenInformation.argtypes = [w.HANDLE, w.DWORD, c.c_void_p, w.DWORD, c.POINTER(w.DWORD)]
              a.GetTokenInformation.restype = w.BOOL
              k.IsProcessInJob.argtypes = [w.HANDLE, w.HANDLE, c.POINTER(w.BOOL)]
              k.IsProcessInJob.restype = w.BOOL
              process = k.GetCurrentProcess()
              token = w.HANDLE()
              if not a.OpenProcessToken(process, 8, c.byref(token)):
                  print("HOST_TOKEN_FACTS_UNAVAILABLE")
                  return
              try:
                  def get(kind):
                      value = w.DWORD()
                      size = w.DWORD()
                      if not a.GetTokenInformation(token, kind, c.byref(value), c.sizeof(value), c.byref(size)):
                          return None
                      return value.value
                  elevation = get(20)
                  token_type = get(18)
                  session = get(12)
                  print("HOST_ELEVATED=" + {0:"NO",1:"YES"}.get(elevation,"UNKNOWN"))
                  print("HOST_TOKEN_TYPE=" + {1:"DEFAULT",2:"FULL",3:"LIMITED"}.get(token_type,"UNKNOWN"))
                  print("HOST_SESSION=" + ("UNKNOWN" if session is None else "ZERO" if session == 0 else "NONZERO"))
                  job = w.BOOL()
                  success = k.IsProcessInJob(process, None, c.byref(job))
                  print("HOST_IN_JOB=" + ("UNKNOWN" if not success else "YES" if job.value else "NO"))
                  linked = w.HANDLE()
                  size = w.DWORD()
                  if a.GetTokenInformation(token, 19, c.byref(linked), c.sizeof(linked), c.byref(size)):
                      try:
                          print("HOST_LINKED_TOKEN=YES")
                      finally:
                          if linked.value:
                              k.CloseHandle(linked)
                  else:
                      err = c.get_last_error()
                      print("HOST_LINKED_TOKEN=NO;WINERROR=" + str(err))
                  u = c.WinDLL("user32", use_last_error=True)
                  u.GetShellWindow.restype = w.HWND
                  print("HOST_SHELL_WINDOW=" + ("YES" if u.GetShellWindow() else "NO"))
              finally:
                  k.CloseHandle(token)

          def summarize_failures(suite, output):
              import hashlib, re
              # The public output is deliberately limited to opaque test IDs and fixed categories.
              raw = output.decode("utf-8", "replace")
              pattern = r"(?m)^(FAIL|ERROR): ([A-Za-z0-9_.]+ \([A-Za-z0-9_.]+\))[ \t\r]*$"
              matches = list(re.finditer(pattern, raw))
              exception_types = ("PermissionError", "AssertionError", "OSError", "RuntimeError", "FileNotFoundError", "TimeoutExpired", "JSONDecodeError", "ValueError", "KeyError", "ImportError", "ModuleNotFoundError", "AttributeError", "TypeError")
              categories = {
                  "C6_ELEVATED_LEGACY_PAIR_REQUIRED": "TOKEN_PAIR_REQUIRED",
                  "C6_LEGACY_TOKEN_UNREPRESENTATIVE": "TOKEN_PAIR_UNREPRESENTATIVE",
                  "C6_LEGACY_CHILD_TOKEN_DRIFT": "CHILD_TOKEN_DRIFT",
                  "C6_LEGACY_LAUNCH": "NATIVE_LAUNCH",
                  "A4_NORMAL_OPERATOR_REQUIRED": "OPERATOR_ROLE",
                  "A4_WORKER_RUNTIME_PATH": "RUNTIME_PATH",
                  "A4_UNEXPECTED_SUPERVISOR": "SUPERVISOR_IDENTITY",
                  "A4_PEER_IMAGE": "PEER_IMAGE",
                  "A4_COG5_MANAGED_ORIGIN": "SOURCE_ORIGIN",
                  "A4_G0_PREREVIEW_SOURCE_DRIFT": "SOURCE_DRIFT",
                  "FIXTURE_BLOB_DRIFT": "FIXTURE_BLOB_DRIFT",
                  "HISTORICAL_TEST_PATCH_DRIFT": "FIXTURE_PATCH_DRIFT",
              }
              def classify(block):
                  types = sorted({kind for kind in exception_types if re.search(r"(?m)^(?:[A-Za-z0-9_.]+\.)?" + kind + r"(?::|$)", block)})
                  codes = sorted({label for marker,label in categories.items() if marker in block})
                  win = sorted({n for n in re.findall(r"\[WinError ([0-9]+)\]", block) if n in {"2","3","5","6","32","87","109","122","203","233","259","267","740","995","1008","1314","1326","1349","1364","1385","1460"}})
                  return ("|".join(types) or "UNCLASSIFIED", "|".join(codes) or "NONE", "|".join(win) or "NONE")
              print("DIAG_" + suite + "_FAILURE_HEADERS=" + str(len(matches)))
              for i, match in enumerate(matches[:32]):
                  block = raw[match.end():matches[i+1].start() if i+1 < len(matches) else len(raw)]
                  # Stop at the unittest summary so subsequent unrelated text cannot be classified.
                  block = re.split(r"(?m)^[-=]{20,}[ \t\r]*$", block, maxsplit=2)
                  block = "\n".join(block[:2])
                  ident = hashlib.sha256(match.group(2).encode("ascii")).hexdigest()[:24]
                  typ, category, win = classify(block)
                  print("DIAG_" + suite + "=" + match.group(1) + ":" + ident + ";TYPE=" + typ + ";CATEGORY=" + category + ";WINERROR=" + win)
              if not matches:
                  typ, category, win = classify(raw)
                  print("DIAG_" + suite + "=NO_TEST_HEADER;TYPE=" + typ + ";CATEGORY=" + category + ";WINERROR=" + win)

          def targeted_diagnostic(source, env, git, py):
              import ast, hashlib, json, runpy, tempfile
              # Resolve previously reported opaque IDs against the verified private test trees.
              def select(root, target):
                  found = []
                  for path in sorted((root / "tests").glob("test_*.py")):
                      tree = ast.parse(path.read_bytes())
                      for cls in tree.body:
                          if isinstance(cls, ast.ClassDef):
                              for method in cls.body:
                                  if isinstance(method, ast.FunctionDef) and method.name.startswith("test_"):
                                      name = path.stem + "." + cls.name + "." + method.name
                                      header = method.name + " (" + name + ")"
                                      if hashlib.sha256(header.encode("ascii")).hexdigest()[:24] == target:
                                          found.append(name)
                  if len(found) != 1:
                      raise RuntimeError()
                  return found[0]
              driver = "import json, os, sys, unittest\nfrom pathlib import Path\nroot=Path(sys.argv[1])\nsys.path[:0]=[str(root),str(root/'tests')]\nname=sys.argv[2]\nkind=sys.argv[3]\nallowed_types={\"OSError\",\"PermissionError\",\"FileNotFoundError\",\"AssertionError\",\"RuntimeError\",\"BoundaryError\",\"ValueError\",\"TypeError\",\"AttributeError\",\"ImportError\",\"ModuleNotFoundError\",\"TimeoutError\",\"OperationalError\"}\nallowed_codes={\"A4_NATIVE_ADMISSION_REQUIRED\",\"A4_DOCKER_DESTINATION_DRIFT\",\"A4_UNKNOWN_NO_REPLAY\",\"A4_SQLITE_RESERVATION_REQUIRED\",\"A4_LIVE_NO_G0_NO_DISPATCH\",\"A4_LIVE_INPUT_BINDING\",\"C6_ELEVATED_LEGACY_PAIR_REQUIRED\",\"C6_LEGACY_TOKEN_UNREPRESENTATIVE\",\"C6_SESSION_TOKEN_MISMATCH\",\"C6_DUPLICATE_TOKEN_DRIFT\",\"C6_LEGACY_CHILD_TOKEN_DRIFT\",\"C6_LEGACY_LAUNCH\",\"STORAGE_REDIRECTED\",\"STORE_CONFIGURATION\"}\ndef number(x):\n    return x if type(x) is int and 0<=x<=65535 else None\nclass Result(unittest.TestResult):\n    def __init__(self):\n        super().__init__()\n        self.events=[]\n    def record(self, status, err):\n        exc=err[1]\n        t=type(exc).__name__\n        code=getattr(exc,\"code\",None)\n        self.events.append(dict(status=status,type=t if t in allowed_types else \"OTHER\",code=code if isinstance(code,str) and code in allowed_codes else \"NONE\",winerror=number(getattr(exc,\"winerror\",None)),errno=number(getattr(exc,\"errno\",None))))\n    def addError(self,test,err):\n        self.record(\"ERROR\",err)\n        super().addError(test,err)\n    def addFailure(self,test,err):\n        self.record(\"FAIL\",err)\n        super().addFailure(test,err)\n    def addSubTest(self,test,subtest,err):\n        if err is not None:\n            self.record(\"SUBTEST\",err)\n        super().addSubTest(test,subtest,err)\nprobe=None\nif kind==\"A4\":\n    from mainalto.a4_native import CLI\n    probe=CLI.is_file()\nresult=Result()\nsuite=unittest.defaultTestLoader.loadTestsFromName(name)\nif suite.countTestCases()!=1:\n    raise RuntimeError(\"TARGET_COUNT\")\nsuite.run(result)\nprint(json.dumps(dict(tests=result.testsRun,skips=len(result.skipped),success=result.wasSuccessful(),events=result.events,cliPresent=probe)))\nsys.exit(0 if result.wasSuccessful() and result.testsRun==1 and not result.skipped else 1)\n"
              def run_case(root, kind, target):
                  name = select(root, target)
                  try:
                      p = subprocess.run([py, "-I", "-B", "-S", "-c", driver, str(root), name, kind],
                                         cwd=root, env=env, stdin=subprocess.DEVNULL,
                                         stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=90)
                  except subprocess.TimeoutExpired:
                      print("TARGET_" + kind + "=TIMEOUT")
                      return False
                  try:
                      result = json.loads(p.stdout.decode("utf-8").strip().splitlines()[-1])
                      if result["tests"] != 1 or type(result["success"]) is not bool or type(result["skips"]) is not int:
                          raise RuntimeError()
                      if kind == "A4":
                          print("TARGET_A4_CLI_PRESENT=" + ("YES" if result["cliPresent"] is True else "NO" if result["cliPresent"] is False else "UNKNOWN"))
                      for event in result["events"]:
                          status = event["status"] if event["status"] in ("ERROR","FAIL","SUBTEST") else "OTHER"
                          typ = event["type"] if event["type"] in ("OSError","PermissionError","FileNotFoundError","AssertionError","RuntimeError","BoundaryError","ValueError","TypeError","AttributeError","ImportError","ModuleNotFoundError","TimeoutError","OperationalError","OTHER") else "OTHER"
                          code = event["code"] if event["code"] in ("A4_NATIVE_ADMISSION_REQUIRED","A4_DOCKER_DESTINATION_DRIFT","A4_UNKNOWN_NO_REPLAY","A4_SQLITE_RESERVATION_REQUIRED","A4_LIVE_NO_G0_NO_DISPATCH","A4_LIVE_INPUT_BINDING","C6_ELEVATED_LEGACY_PAIR_REQUIRED","C6_LEGACY_TOKEN_UNREPRESENTATIVE","C6_SESSION_TOKEN_MISMATCH","C6_DUPLICATE_TOKEN_DRIFT","C6_LEGACY_CHILD_TOKEN_DRIFT","C6_LEGACY_LAUNCH","STORAGE_REDIRECTED","STORE_CONFIGURATION","NONE") else "OTHER"
                          def num(x):
                              return str(x) if type(x) is int and 0 <= x <= 65535 else "NONE"
                          print("TARGET_" + kind + "=" + status + ";TYPE=" + typ + ";CODE=" + code + ";WINERROR=" + num(event["winerror"]) + ";ERRNO=" + num(event["errno"]))
                      passed = p.returncode == 0 and result["success"] and result["skips"] == 0 and not result["events"]
                      print("TARGET_" + kind + "_RESULT=" + ("PASS" if passed else "FAIL"))
                      return passed
                  except BaseException:
                      print("TARGET_" + kind + "=UNCLASSIFIED")
                      return False
              harness = runpy.run_path(str(source / "tests" / "run_a4_reconciled.py"))
              current = harness["manifest"](source, harness["MANIFESTS"][2])
              harness["verify"](source, current)
              with tempfile.TemporaryDirectory(prefix="mainalto-targeted-") as temp:
                  hist = pathlib.Path(temp).resolve() / "historical"
                  historical = harness["HISTORICAL"]
                  harness["materialize"](git("archive", "--format=zip", historical), hist)
                  old = harness["manifest"](source, harness["MANIFESTS"][0])
                  harness["verify"](hist, old)
                  a = run_case(source, "BOOTSTRAP", "9687cb2e439dfd2524b061f6")
                  b = run_case(hist, "A4", "d0ae12116dd4ba6d6e7aa28a")
                  harness["verify"](hist, old)
              return a and b
          def main():
              diagnostic = os.environ.get("MAINALTO_CI_WINDOWS_DIAGNOSTIC", "false").lower() == "true"
              if diagnostic and os.name != "nt":
                  raise RuntimeError()
              root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mainalto-private-ci"
              source = root / "source"
              pin = (root / "approved-pin").read_text(encoding="ascii")
              allowed = set("PATH PATHEXT SYSTEMROOT WINDIR COMSPEC TEMP TMP TMPDIR HOME USERPROFILE LOCALAPPDATA APPDATA SYSTEMDRIVE HOMEDRIVE HOMEPATH USERNAME USER LOGNAME LANG LC_ALL PROCESSOR_ARCHITECTURE NUMBER_OF_PROCESSORS OS PROGRAMFILES PROGRAMFILES(X86) PROGRAMW6432 ALLUSERSPROFILE PROGRAMDATA".split())
              env = {k:v for k,v in os.environ.items() if k.upper() in allowed}
              env.update(PYTHONDONTWRITEBYTECODE="1", PYTHONUTF8="1", GIT_TERMINAL_PROMPT="0", GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=os.devnull, GIT_NO_REPLACE_OBJECTS="1")
              py = sys.executable
              def discovery(pattern):
                  return [py, "-B", "-m", "unittest", "discover", "-s", "tests", "-p", pattern, "-v"]
              suites = [
                  ("BOOTSTRAP", discovery("test_*bootstrap*.py")),
                  ("A2", discovery("test_a2*.py")),
                  ("A4", [py, "-B", "tests/run_a4_reconciled.py", "--require-cogi3-closure"]),
                  ("COGNITIVE", discovery("test_cognitive*.py")),
                  ("C5", discovery("test_c5*.py")),
                  ("C6", discovery("test_c6_native*.py")),
                  ("A3", discovery("test_a3*.py")),
                  ("T4", [py, "-IB", "tools/transport_proof.py"]),
                  ("OFFLINE", [py, "-B", "tools/bootstrap_mainalto.py", "--root", ".", "--offline"])
              ]
              if os.name == "nt":
                  suites.append(("PS7", ["pwsh", "-NoProfile", "-NonInteractive", "-File", "tools/Invoke-MainAltoBootstrap.ps1", "-MainRoot", ".", "-Offline", "-Territory", "gpt-alto"]))
              def git(*args):
                  return subprocess.run(["git", "-C", str(source), *args], env=env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=30, check=True).stdout
              if git("rev-parse", "HEAD").decode().strip() != pin:
                  raise RuntimeError()
              verify_raw_tree(source, pin, git)
              if diagnostic:
                  token_facts()
                  passed = targeted_diagnostic(source, env, git, py)
                  if git("rev-parse", "HEAD").decode().strip() != pin:
                      raise RuntimeError()
                  verify_raw_tree(source, pin, git)
                  git("diff", "--quiet")
                  git("diff", "--cached", "--quiet")
                  return 0 if passed else 1
              failed = False
              for name, args in suites:
                  try:
                      p = subprocess.run(args, cwd=source, env=env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE if diagnostic else subprocess.DEVNULL, stderr=subprocess.STDOUT if diagnostic else subprocess.DEVNULL, timeout=240)
                      result = "PASS" if p.returncode == 0 else "FAIL"
                      if diagnostic and p.returncode != 0:
                          summarize_failures(name, p.stdout)
                  except subprocess.TimeoutExpired as exc:
                      result = "TIMEOUT"
                      if diagnostic and exc.stdout:
                          summarize_failures(name, exc.stdout)
                  except OSError:
                      result = "START_FAIL"
                  print(name + "=" + result, flush=True)
                  if result != "PASS":
                      failed = True
              if git("rev-parse", "HEAD").decode().strip() != pin:
                  raise RuntimeError()
              verify_raw_tree(source, pin, git)
              git("diff", "--quiet")
              git("diff", "--cached", "--quiet")
              return 1 if failed else 0
          try:
              code = main()
          except BaseException:
              print("PRIVATE_VALIDATION_INTERNAL_FAIL")
              sys.exit(1)
          print("PRIVATE_VALIDATION_" + ("PASS" if code == 0 else "FAIL"))
          sys.exit(code)
          '@ | python -I -B -S -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove temporary checkout
        if: always()
        shell: pwsh
        run: |
          @'
          import os, pathlib, shutil, stat, sys
          def retry(func, path, exc):
              os.chmod(path, stat.S_IREAD | stat.S_IWRITE)
              func(path)
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mainalto-private-ci"
          try:
              if root.exists():
                  shutil.rmtree(root, onexc=retry)
              if root.exists():
                  raise RuntimeError()
          except BaseException:
              print("PRIVATE_CLEANUP_FAIL")
              sys.exit(1)
          print("PRIVATE_CLEANUP_PASS")
          '@ | python -I -B -S -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
